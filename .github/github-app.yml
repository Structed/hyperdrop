# Repository configuration for the GitHub Copilot app.
# See https://docs.github.com/copilot/reference/github-copilot-app-reference/repository-configuration
#
# The app asks you to review and accept this file before it applies anything from it.
# Read the scripts below before accepting.

instructions: |
  HyperDrop is a WPF desktop app targeting net10.0-windows that copies files and
  folders into running Hyper-V virtual machines. The solution file is HyperDrop.slnx
  (not .sln). Build with `dotnet build`, test with `dotnet test`. Everything here is
  Windows-only.

  Two things that will cost you time if you do not know them:

  - The app deliberately runs unelevated (`asInvoker`). Hyper-V access is governed by the
    local Hyper-V Administrators group, not by elevation, and elevating breaks drag & drop
    outright. `dotnet run` works fine. Do not "fix" the manifest back to
    requireAdministrator.
  - Never set InvariantGlobalization to true in Directory.Build.props. WPF resolves
    FrameworkElement.Language through XmlLanguage, which cannot find a specific
    culture for "en-us" in invariant mode. The build stays perfectly clean and the
    app dies before showing its first window.

  Drag and drop is the part of this app most likely to be broken by a well-meaning change.
  WPF only speaks OLE drag & drop, and Windows UIPI blocks that protocol into a window at a
  higher integrity level than the dragging process — with no error anywhere. Note that
  ChangeWindowMessageFilterEx does NOT lift it, despite being widely recommended for this:
  it only reaches the legacy WM_DROPFILES protocol. Interop/WindowDropTarget.cs picks
  between the two protocols and is where any drop change belongs.

  HyperDrop.Core must stay free of UI dependencies. Copy engines sit behind
  IGuestFileCopier and machine enumeration behind IVmProvider, which is what lets the
  transfer queue, drop expansion, rate estimation, error mapping and settings be unit
  tested without Hyper-V and without any special group membership. Keep new Hyper-V or WPF
  specifics behind those seams so the test suite keeps running on a plain CI runner.

scripts:
  - name: Restore
    command: dotnet restore
    triggers:
      - session.create

  - name: Build
    command: dotnet build --nologo

  - name: Test
    command: dotnet test --nologo

  # The app runs unelevated, so this is an ordinary launch.
  - name: Run
    command: 'dotnet build src/HyperDrop.App --nologo; if ($LASTEXITCODE -eq 0) { Start-Process -FilePath .\src\HyperDrop.App\bin\Debug\net10.0-windows\HyperDrop.exe }'

  # Build output is regenerable, so reclaim it when a session is archived.
  - name: Clean build output
    command: 'Get-ChildItem -Path . -Include bin,obj,publish,artifacts -Recurse -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue'
    triggers:
      - session.archive

# HyperDrop is a desktop app and never starts a server, so there is no URL to open.
auto_open_in_browser: false
